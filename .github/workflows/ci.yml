name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host test suites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Clone Certainly (fetch-only dependency)
        run: git clone --recursive --depth 1 https://github.com/minorbug/certainly.git ../Certainly
      - name: Protocol, loop and File Manager fault suites (ASan/UBSan)
        run: tools/check.sh
      - name: TLS transport suites (ASan/UBSan)
        run: tools/check-transport.sh

  lint:
    name: Lint and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck, cppcheck and ruff
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck cppcheck python3-venv
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ruff==0.16.10
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Shell, C and Python checks
        run: tools/lint.sh

  coverage:
    name: Host coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM coverage tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 llvm-18
      - name: Clone Certainly (fetch-only dependency)
        run: git clone --recursive --depth 1 https://github.com/minorbug/certainly.git ../Certainly
      - name: Line and branch coverage over the host suites
        run: tools/check-coverage.sh
